<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f3a6b">
<meta name="description" content="Traducteur Français / Anglais / Espagnol ⇄ Éwé avec dictée et lecture vocale.">
<title>DACK_Trad</title>
<link rel="icon" href="logo.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<main>
<header>
  <img src="logo.ico" alt="Logo DACK">
  <div>
    <h1>DACK_Trad</h1>
    <p>Français · Anglais · Espagnol ⇄ Éwé</p>
  </div>
</header>

<div class="seg" role="group" aria-label="Sens de traduction">
 <button id="d1" aria-pressed="true">FR / EN / ES → Éwé</button>
 <button id="d2" aria-pressed="false">Éwé → FR / EN / ES</button>
</div>
<div class="opts">
 <label id="tw" hidden>Traduire l'éwé vers <select id="tl"><option value="fr">Français</option><option value="en">Anglais</option><option value="es">Espagnol</option></select></label>
 <span id="hint"></span>
 <label><input type="checkbox" id="atr" checked> Traduction automatique</label>
 <input type="checkbox" id="nbr" checked hidden>
 <label><input type="checkbox" id="auto"> Lecture automatique du résultat</label>
</div>
<div class="card">
 <h2>Texte à traduire</h2>
 <textarea id="in" placeholder="Écris ton texte ou un nombre : la traduction apparaît automatiquement."></textarea>
 
 <!-- Clavier Virtuel Éwé + Classique -->
 <div id="ewe-kbd" class="ewe-keyboard">
  <div class="ewe-keyboard-header">
   <span>Clavier virtuel (Éwé & AZERTY)</span>
   <button type="button" class="b" id="toggle-case" style="padding:2px 8px; font-size:12px;">Maj / Min</button>
  </div>
  <div class="ewe-keyboard-keys" id="ewe-keys">
   <!-- Touches générées par JS -->
  </div>
 </div>

 <div class="row">
  <button class="b" id="mic" type="button">🎤 Dicter</button>
  <select id="vl" aria-label="Langue de dictée">
   <option value="fr-FR">Dicter en français</option>
   <option value="en-US">Dicter en anglais</option>
   <option value="es-ES">Dicter en espagnol</option>
   <option value="ee-TG">Dicter en éwé</option>
  </select>
  <button class="b" id="toggle-kbd" type="button">⌨️ Clavier virtuel</button>
  <button class="b" id="clr">Effacer</button>
 </div>
 <div class="det" id="det"></div>
</div>

<button class="b pri" id="go">Traduire  ▶</button>
<div class="card"><h2>Traduction</h2><div id="out" aria-live="polite"></div>
 <div class="row"><button class="b" id="say" disabled>🔊 Écouter</button><button class="b" id="cp" disabled>Copier</button></div></div>
<div class="det" id="eh" hidden></div>
<div id="st">Prêt.</div>
</main>

<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#17233b;--mute:#66708a;--navy:#1f3a6b;--line:#dde2ec;--out:#eef2f9;--err:#a12a1e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1524;--card:#18203a;--ink:#e8ecf5;--mute:#9aa5c0;--navy:#7fa2e6;--line:#2a3555;--out:#121a30;--err:#ff9b8f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,"SF Pro Text",sans-serif;-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
main{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
header img{width:44px;height:44px;object-fit:contain}
h1{margin:0;font-size:24px}
header p{margin:0;color:var(--mute);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--card)}
.seg button{border:0;background:none;padding:12px 8px;font:inherit;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){.seg button[aria-pressed=true]{color:#0f1524}}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--mute);font-size:14px}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:600}
textarea{width:100%;min-height:130px;border:0;resize:vertical;font:inherit;background:none;color:var(--ink);outline:0}
#out{min-height:130px;white-space:pre-wrap;background:var(--out);border-radius:8px;padding:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button.b{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.b:disabled{opacity:.5;cursor:default}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;width:100%;padding:14px;margin-bottom:12px}
@media(prefers-color-scheme:dark){button.pri{color:#0f1524}}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.det{color:var(--mute);font-size:13px;min-height:1.3em;margin-top:6px}
#mic.on{background:#c0392b;border-color:#c0392b;color:#fff}
#vl{max-width:100%;min-width:190px}
#mic{white-space:nowrap}
#st{color:var(--mute);font-size:13px;padding:6px 2px}
#st.err{color:var(--err)}

/* Clavier Virtuel Complèt (Éwé + AZERTY) */
.ewe-keyboard{margin-top:10px;padding:10px;background:var(--out);border:1px solid var(--line);border-radius:8px;display:none;flex-direction:column;gap:8px}
.ewe-keyboard.visible{display:flex}
.ewe-keyboard-header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);font-weight:600}
.ewe-keyboard-keys{display:flex;flex-direction:column;gap:6px}
.kbd-row{display:flex;gap:4px;justify-content:center;width:100%}
.ewe-key{flex:1;min-width:26px;max-width:44px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background 0.1s}
.ewe-key:active{background:var(--line)}
.ewe-key.special{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(prefers-color-scheme:dark){.ewe-key.special{color:#0f1524}}
.ewe-key.wide{flex:2;max-width:88px}
.ewe-key.space{flex:5;max-width:240px}
</style>

<script>
const $=s=>document.getElementById(s);
const NOMS={fr:'Français',en:'Anglais',es:'Espagnol',ee:'Éwé'},VOIX={fr:'fr-FR',en:'en-US',es:'es-ES',ee:'ee'};
let vers=true,outLang='ee',busy=false,pauseUntil=0,blocs=0,cache={};
const CACHE_KEY='dacktrad_cache';
try{cache=JSON.parse(localStorage.getItem(CACHE_KEY))||{}}catch(e){}
const stat=(t,err)=>{$('st').textContent=t;$('st').className=err?'err':''};

/* ---------- Clavier Virtuel Éwé + AZERTY ---------- */
const KBD_LAYOUT_LOWER = [
 ['ɖ', 'ŋ', 'ƒ', 'ʋ', 'ɔ', 'ɛ', 'ɣ'],
 ['a', 'z', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
 ['q', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm'],
 ['w', 'x', 'c', 'v', 'b', 'n', 'é', 'è', 'à', 'ç']
];

const KBD_LAYOUT_UPPER = [
 ['Ɖ', 'Ŋ', 'Ƒ', 'Ʋ', 'Ɔ', 'Ɛ', 'Ɣ'],
 ['A', 'Z', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
 ['Q', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'M'],
 ['W', 'X', 'C', 'V', 'B', 'N', 'É', 'È', 'À', 'Ç']
];

let isUpper = false;

function renderEweKeyboard() {
 const container = $('ewe-keys');
 container.innerHTML = '';
 const layout = isUpper ? KBD_LAYOUT_UPPER : KBD_LAYOUT_LOWER;
 
 layout.forEach((row, idx) => {
  const rowDiv = document.createElement('div');
  rowDiv.className = 'kbd-row';
  row.forEach(ch => {
   const btn = document.createElement('button');
   btn.type = 'button';
   btn.className = 'ewe-key' + (idx === 0 ? ' special' : '');
   btn.textContent = ch;
   btn.onclick = (e) => { e.preventDefault(); insertChar(ch); };
   rowDiv.appendChild(btn);
  });
  container.appendChild(rowDiv);
 });

 // Rangée inférieure (Espace, Effacer, Entrée)
 const bottomRow = document.createElement('div');
 bottomRow.className = 'kbd-row';

 const spaceBtn = document.createElement('button');
 spaceBtn.type = 'button';
 spaceBtn.className = 'ewe-key space';
 spaceBtn.textContent = 'Espace';
 spaceBtn.onclick = (e) => { e.preventDefault(); insertChar(' '); };

 const backBtn = document.createElement('button');
 backBtn.type = 'button';
 backBtn.className = 'ewe-key wide';
 backBtn.textContent = '⌫';
 backBtn.onclick = (e) => { e.preventDefault(); deleteChar(); };

 const enterBtn = document.createElement('button');
 enterBtn.type = 'button';
 enterBtn.className = 'ewe-key wide';
 enterBtn.textContent = '↵';
 enterBtn.onclick = (e) => { e.preventDefault(); insertChar('\n'); };

 bottomRow.appendChild(spaceBtn);
 bottomRow.appendChild(backBtn);
 bottomRow.appendChild(enterBtn);
 container.appendChild(bottomRow);
}

function insertChar(ch) {
 const ta = $('in');
 const start = ta.selectionStart;
 const end = ta.selectionEnd;
 const val = ta.value;
 ta.value = val.substring(0, start) + ch + val.substring(end);
 ta.selectionStart = ta.selectionEnd = start + ch.length;
 ta.focus();
 planifier();
}

function deleteChar() {
 const ta = $('in');
 const start = ta.selectionStart;
 const end = ta.selectionEnd;
 const val = ta.value;
 if (start === end && start > 0) {
  ta.value = val.substring(0, start - 1) + val.substring(end);
  ta.selectionStart = ta.selectionEnd = start - 1;
 } else if (start !== end) {
  ta.value = val.substring(0, start) + val.substring(end);
  ta.selectionStart = ta.selectionEnd = start;
 }
 ta.focus();
 planifier();
}

$('toggle-case').onclick = () => {
 isUpper = !isUpper;
 renderEweKeyboard();
};

$('toggle-kbd').onclick = () => {
 const kbd = $('ewe-kbd');
 kbd.classList.toggle('visible');
};

renderEweKeyboard();

function setDir(v){
 vers=v;
 $('d1').setAttribute('aria-pressed',v);
 $('d2').setAttribute('aria-pressed',!v);$('tw').hidden=v;
 $('hint').textContent='';$('det').textContent='';
 
 const kbd = $('ewe-kbd');
 if (!v) {
  kbd.classList.add('visible');
  $('vl').value = 'ee-TG';
 } else {
  kbd.classList.remove('visible');
  if ($('vl').value === 'ee-TG')$('vl').value = 'fr-FR';
 }
}

let timer=null,pending=false;
function planifier(){
 clearTimeout(timer);
 if(!$('atr').checked)return;
 if(!$('in').value.trim()){$('out').textContent='';$('det').textContent='';$('say').disabled=$('cp').disabled=true;return}
 timer=setTimeout(()=>traduire(true),800);
}
$('d1').onclick=()=>{setDir(true);planifier()};$('d2').onclick=()=>{setDir(false);planifier()};$('tl').onchange=planifier;$('atr').onchange=()=>{if($('atr').checked)planifier();else clearTimeout(timer)};
$('in').addEventListener('input',planifier);$('clr').onclick=()=>{$('in').value='';$('out').textContent='';$('det').textContent='';$('say').disabled=$('cp').disabled=true;speechSynthesis&&speechSynthesis.cancel();$('in').focus()};

/* Découpe en blocs pour Google Translate */
function decouper(t,max=1200){
 const out=[];let cur='';
 for(const s of t.replace(/([.!?…])\s+/g,'$1\n').split(/\s*\n\s*/)){
  if((cur+' '+s).length>max&&cur){out.push(cur);cur=s}else cur=cur?cur+' '+s:s;
  while(cur.length>max){out.push(cur.slice(0,max));cur=cur.slice(max)}
 }
 if(cur.trim())out.push(cur);return out;
}
async function appelGoogle(texte,sl,tl){
 const u='https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+sl+'&tl='+tl+'&q='+encodeURIComponent(texte);
 const r=await fetch(u);
 if(r.status===429||r.status===503){const e=new Error('too many requests');e.limite=true;throw e}
 if(!r.ok)throw new Error('Erreur du service de traduction (code '+r.status+').');
 const d=await r.json();
 return{txt:d[0].map(x=>x[0]).join(''),det:d[2]};
}
async function traduire(auto){
 const texte=$('in').value.trim();
 if(!texte)return auto===true?null:stat('Écris d\'abord un texte à traduire.',1);
 const loc=$('nbr').checked?conversionLocale(texte):null;
 if(loc){affiche({txt:loc.txt,det:null},loc.tl);$('det').textContent=loc.det;stat('Nombre converti (sans connexion).');if($('auto').checked)ecouter(true);return}
 if(busy){pending=true;return}
 if(Date.now()<pauseUntil){
  const reste=Math.ceil((pauseUntil-Date.now())/1000);
  stat(`Google Translate est en pause : la traduction reprendra automatiquement dans ${reste} s.`,1);
  if(auto===true&&$('atr').checked){clearTimeout(timer);timer=setTimeout(()=>traduire(true),reste*1000+300)}
  return;
 }
 const tl=vers?'ee':$('tl').value,sl=vers?'auto':'ee',key=sl+'>'+tl+'\vert{}'+($('nbr').checked?'n|':'')+texte;
 if(cache[key]){affiche(cache[key],tl);return stat('')}
 busy=true;$('go').disabled=true;stat('Traduction en cours…');
 try{
  let res='',det=null;const source=!vers&&$('nbr').checked?eweChiffres(texte):texte;
  for(const b of decouper(source)){const r=await appelGoogle(b,sl,tl);res+=(res?' ':'')+r.txt;det=det||r.det;await new Promise(r=>setTimeout(r,150))}
  if(vers&&$('nbr').checked)res=chiffresEnEwe(res);
  const rec={txt:res,det:vers?det:null};
  cache[key]=rec;try{localStorage.setItem(CACHE_KEY,JSON.stringify(cache))}catch(e){}
  blocs=0;affiche(rec,tl);stat('Traduction terminée.');
  if($('auto').checked)ecouter(true);
 }catch(e){
  if(e.limite){const d=Math.min(20*2**blocs,180);blocs++;pauseUntil=Date.now()+d*1000;stat(`⏸ Limite de Google Translate atteinte — pause de ${d} s, la traduction reprendra ensuite automatiquement.`,1);if($('atr').checked){clearTimeout(timer);timer=setTimeout(()=>traduire(true),d*1000+300)}}
  else stat(e instanceof TypeError?'Impossible de joindre le service de traduction. Vérifie ta connexion Internet.':e.message,1);
 }finally{busy=false;$('go').disabled=false;if(pending){pending=false;planifier()}}
}
function affiche(rec,tl){
 outLang=tl;$('eh').hidden=tl!=='ee';$('out').textContent=rec.txt;$('say').disabled=$('cp').disabled=false;
 $('det').textContent=vers?(rec.det?'Langue détectée : '+(NOMS[rec.det]||rec.det):'Langue détectée automatiquement par Google Translate.'):'Traduit vers : '+NOMS[tl];
}
$('go').onclick=()=>traduire();$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))traduire()});

/* ---------- Lecture vocale ---------- */
let busyTts=false,lastEwe={t:'',data:null,rate:16000},ewe=null,eweP=null,src=null,actx=null;
function jouer(data,rate){
 if(src){try{src.stop()}catch(e){}}
 actx=actx||new(window.AudioContext||window.webkitAudioContext)();
 const b=actx.createBuffer(1,data.length,rate);b.copyToChannel(data,0);
 src=actx.createBufferSource();src.buffer=b;src.connect(actx.destination);
 src.onended=()=>stat('Lecture terminée.');src.start();
}
function voixSysteme(t,code){
 const voices=speechSynthesis.getVoices(),base=code.slice(0,2);
 const v=voices.find(x=>x.lang.replace('_','-').toLowerCase()===code.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(base));
 if(!v&&code==='ee')return false;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:code;if(v)u.voice=v;
 u.onend=()=>stat('Lecture terminée.');u.onerror=()=>stat('Erreur de lecture vocale.',1);
 stat('Lecture en cours…');speechSynthesis.speak(u);return true;
}
async function ecouter(auto){
 const t=$('out').textContent.trim();if(!t)return;
 if(outLang==='ee')return ecouterEwe(t,auto===true);
 if(!('speechSynthesis'in window))return stat('La lecture vocale n\'est pas prise en charge par ce navigateur.',1);
 voixSysteme(t,VOIX[outLang]);
}

/* ---------- Voix éwé : modèle MMS de Meta ---------- */
const ORT_BASE='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
const HF='https://huggingface.co/willwade/mms-tts-multilingual-models-onnx/resolve/main/ewe/';
const idb=(m,k,v)=>new Promise((ok,ko)=>{const r=indexedDB.open('dacktrad',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onerror=()=>ko(r.error);r.onsuccess=()=>{const s=r.result.transaction('m',m==='get'?'readonly':'readwrite').objectStore('m'),q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)}});
async function telecharger(url,label){
 const r=await fetch(url);if(!r.ok)throw new Error('Téléchargement impossible (code '+r.status+').');
 const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let n=0;
 for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);n+=value.length;stat(total?`${label} : ${Math.round(n/total*100)} %`:`${label} : ${Math.round(n/1048576)} Mo`)}
 const out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out;
}
function lireVocab(txt){
 const v={};
 for(let l of txt.split('\n')){l=l.replace(/\r$/,'');const i=l.lastIndexOf(' ');if(i<0)continue;const id=+l.slice(i+1);if(l.slice(i+1)!==''&&!isNaN(id))v[l.slice(0,i)]=id}
 return v;
}
function chargerEwe(){
 if(ewe)return Promise.resolve(ewe);
 if(!eweP)eweP=(async()=>{
  await new Promise((ok,ko)=>{if(window.ort)return ok();const s=document.createElement('script');s.src=ORT_BASE+'ort.min.js';s.onload=ok;s.onerror=()=>ko(new Error('Impossible de charger le moteur audio. Vérifie ta connexion Internet.'));document.head.append(s)});
  ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths=ORT_BASE;
  let model=null,tok=null;
  try{model=await idb('get','model');tok=await idb('get','tokens')}catch(e){}
  if(!model){
   if(!confirm('La voix éwé nécessite un téléchargement unique d\'environ 114 Mo (modèle MMS de Meta, licence non commerciale CC-BY-NC). Continuer ?'))throw new Error('téléchargement annulé.');
   model=await telecharger(HF+'model.onnx','Téléchargement de la voix éwé');
   try{await idb('put','model',model)}catch(e){}
  }
  if(!tok){const r=await fetch(HF+'tokens.txt');if(!r.ok)throw new Error('fichier de symboles introuvable (code '+r.status+').');tok=await r.text();try{await idb('put','tokens',tok)}catch(e){}}
  stat('Préparation de la voix éwé…');
  const session=await ort.InferenceSession.create(model,{executionProviders:['wasm']});
  return ewe={session,vocab:lireVocab(tok)};
 })().catch(e=>{eweP=null;throw e});
 return eweP;
}
function idsEwe(texte,vocab){
 const ids=[0];
 for(const ch of texte.toLowerCase().normalize('NFC'))if(Object.prototype.hasOwnProperty.call(vocab,ch))ids.push(vocab[ch],0);
 return ids;
}
async function synthEwe(texte){
 const{session,vocab}=await chargerEwe(),chunks=decouper(texte,220),parts=[];
 for(let i=0;i<chunks.length;i++){
  stat(`Génération de la voix éwé… (${i+1}/${chunks.length})`);
  const ids=idsEwe(chunks[i],vocab);if(ids.length<3)continue;
  const T=ids.length,all={
   x:new ort.Tensor('int64',BigInt64Array.from(ids,BigInt),[1,T]),
   x_length:new ort.Tensor('int64',BigInt64Array.from([BigInt(T)]),[1]),
   noise_scale:new ort.Tensor('float32',new Float32Array([0.667]),[1]),
   length_scale:new ort.Tensor('float32',new Float32Array([1]),[1]),
   noise_scale_w:new ort.Tensor('float32',new Float32Array([0.8]),[1])},feeds={};
  for(const n of session.inputNames){if(!(n in all))throw new Error(`entrée inattendue « ${n} » (entrées du modèle : ${session.inputNames.join(', ')}).`);feeds[n]=all[n]}
  const out=await session.run(feeds);
  parts.push(Float32Array.from(out[session.outputNames[0]].data));
  await new Promise(r=>setTimeout(r,0));
 }
 if(!parts.length)throw new Error('aucun caractère éwé reconnu dans ce texte.');
 const rate=16000,gap=Math.round(rate*.15),len=parts.reduce((s,p)=>s+p.length,0)+gap*(parts.length-1),data=new Float32Array(len);
 let o=0;for(const p of parts){data.set(p,o);o+=p.length+gap}
 return{data,rate};
}
async function ecouterEwe(t,auto){
 actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume();
 if('speechSynthesis'in window&&voixSysteme(t,'ee'))return;
 if(!ewe&&auto)return stat('Clique sur « Écouter » pour télécharger la voix éwé (une seule fois).');
 if(busyTts)return;busyTts=true;$('say').disabled=true;
 try{
  if(lastEwe.t!==t)lastEwe={t,...await synthEwe(t)};
  jouer(lastEwe.data,lastEwe.rate);stat('Lecture en cours…');
 }catch(e){stat('Voix éwé indisponible : '+e.message,1)}
 finally{busyTts=false;$('say').disabled=false}
}

/* ---------- Nombres : chiffres ⇄ éwé ---------- */
const UN=['gbɔ̃','ɖeka','eve','etɔ̃','ene','atɔ̃','adé','adre','enyi','asieke'];
const DIZ=[null,null,'blaeve','blaetɔ̃','blaene','blaatɔ̃','blaadé','blaadre','blaenyi','blaasieke'];
function nombreEwe(n){
 if(n<10)return UN[n];
 if(n===10)return'ewo';
 if(n<20)return'wui'+UN[n-10];
 if(n<100){const d=Math.floor(n/10),r=n%10;return r?DIZ[d]+' vɔ '+UN[r]:DIZ[d]}
 if(n<1000){const c=Math.floor(n/100),r=n%100,p='alafa '+UN[c];return r?p+' kple '+nombreEwe(r):p}
 const m=Math.floor(n/1000),r=n%1000,p='akpe '+nombreEwe(m);return r?p+' kple '+nombreEwe(r):p;
}

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
 .replace(/ɖ/g,'d').replace(/ɔ/g,'o').replace(/ɛ/g,'e').replace(/ŋ/g,'n').replace(/ƒ/g,'f').replace(/ʋ/g,'v').replace(/ɣ/g,'g');
const UNI=Object.create(null),TENS=Object.create(null),TEEN=Object.create(null);
UN.forEach((w,i)=>{UNI[norm(w)]=i;if(i>=1)TEEN['wui'+norm(w)]=10+i});
DIZ.forEach((w,d)=>{if(w)TENS[norm(w)]=d});
UNI.deke=1;UNI.fefe=0;TEEN.wuideke=11;

function groupe(t){
 let i=0,v=0;
 if(t[0]==='alafa'){
  const c=UNI[t[1]];if(!(c>=1))return null;
  v=c*100;i=2;
  if(i===t.length)return v;
  if(t[i]==='kple')i++;
  if(i===t.length)return null;
 }
 const w=t[i];
 if(w===undefined)return null;
 if(TENS[w]){
  v+=TENS[w]*10;i++;
  if(t[i]==='vo'){i++;if(i===t.length)return null}
  if(i<t.length){const u=UNI[t[i]];if(!(u>=1))return null;v+=u;i++}
 }else if(TEEN[w]){v+=TEEN[w];i++}
 else if(w==='ewo'){v+=10;i++}
 else if(UNI[w]>=1){v+=UNI[w];i++}
 else return null;
 return i===t.length&&v>=1?v:null;
}

function valeursEwe(texte){
 const t=norm(texte).split(/[\s,\-]+/).filter(Boolean).map(w=>w.startsWith('ewui')?w.slice(1):w);
 if(!t.length)return[];
 if(t.length===1&&UNI[t[0]]===0)return[0];
 if(t[0]!=='akpe'){const v=groupe(t);return v===null?[]:[v]}
 const res=[];
 for(let j=2;j<=t.length;j++){
  const m=groupe(t.slice(1,j));if(m===null)continue;
  if(j===t.length)res.push(m*1000);
  else{const r=groupe(t.slice(t[j]==='kple'?j+1:j));if(r!==null)res.push(m*1000+r)}
 }
 return[...new Set(res)].sort((a,b)=>a-b);
}

const SIGNIF=new Set([...Object.keys(TENS),...Object.keys(TEEN),'ewo']);

function conversionLocale(texte){
 if(vers){
  if(!/^\d[\d   ]*$/.test(texte))return null;
  const ch=texte.replace(/\D/g,'');
  if(ch.length>6)return null;
  const n=+ch,d=String(n).split('');
  return{txt:nombreEwe(n),tl:'ee',det:'Nombre converti sans connexion · '+d.length+(d.length>1?' chiffres : ':' chiffre : ')+d.map(c=>c+' = '+UN[+c]).join(' · ')};
 }
 const v=valeursEwe(texte);
 if(!v.length)return null;
 const k=String(v[0]).length;
 return{txt:v.join('  ou  '),tl:$('tl').value,
  det:v.length>1?'Nombre éwé reconnu, écriture ambiguë (« kple » relie les centaines ou les milliers).'
   :'Nombre éwé reconnu sans connexion · '+k+(k>1?' chiffres':' chiffre')+' · écriture standard : '+nombreEwe(v[0])};
}

function chiffresEnEwe(texte){
 return texte.replace(/\d+/g,(m,off,str)=>{
  const av=str[off-1]||'',av2=str[off-2]||'',ap=str[off+m.length]||'',ap2=str[off+m.length+1]||'';
  if(m.length>6||(m.length>1&&m[0]==='0'))return m;
  if(/\p{L}/u.test(av)||/\p{L}/u.test(ap))return m;
  if(/[.,:\/\-]/.test(av)&&/\d/.test(av2))return m;
  if(/[.,:\/\-]/.test(ap)&&/\d/.test(ap2))return m;
  if(/[   ]/.test(ap)&&/^\d{3}(?!\d)/.test(str.slice(off+m.length+1)))return m;
  if(/[   ]/.test(av)&&/\d/.test(av2)&&m.length===3)return m;
  return nombreEwe(+m);
 });
}

function eweChiffres(texte){
 const re=/[\p{L}\p{M}]+/gu,mots=[];let m;
 while((m=re.exec(texte)))mots.push({w:m[0],a:m.index,b:m.index+m[0].length});
 let out='',pos=0,i=0;
 while(i<mots.length){
  let pris=0,val=null;
  for(let j=Math.min(mots.length,i+12);j>i;j--){
   let ok=true;
   for(let k=i+1;k<j;k++)if(!/^[  \-]+$/.test(texte.slice(mots[k-1].b,mots[k].a))){ok=false;break}
   if(!ok)continue;
   const v=valeursEwe(texte.slice(mots[i].a,mots[j-1].b));
   if(v.length===1&&v[0]>=1&&(j-i>1||SIGNIF.has(norm(mots[i].w)))){pris=j-i;val=v[0];break}
  }
  if(pris){out+=texte.slice(pos,mots[i].a)+val;pos=mots[i+pris-1].b;i+=pris}else i++;
 }
 return out+texte.slice(pos);
}

/* ---------- Saisie vocale (Web Speech API) ---------- */
(()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('mic');
 if(!SR){mic.hidden=true;$('vl').hidden=true;return}
 let rec=null,base='',on=false;
 const arret=()=>{on=false;mic.classList.remove('on');mic.textContent='🎤 Dicter';$('vl').disabled=false;try{rec&&rec.stop()}catch(e){}};
 function debut(){
  rec=new SR();rec.lang=$('vl').value;rec.continuous=true;rec.interimResults=true;
  const ta=$('in');base=ta.value&&!/\s$/.test(ta.value)?ta.value+' ':ta.value;
  let fin='';
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+(e.results[i].isFinal?' ':'');
   ta.value=(base+t).replace(/ {2,}/g,' ');ta.scrollTop=ta.scrollHeight;planifier()};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')stat('Accès au micro refusé : autorise-le dans le navigateur.',1);else if(e.error!=='no-speech'&&e.error!=='aborted')stat('Dictée indisponible : '+e.error,1);if(e.error==='not-allowed'||e.error==='service-not-allowed')arret()};
  rec.onend=()=>{if(on){base=ta.value&&!/\s$/.test(ta.value)?ta.value+' ':ta.value;fin='';try{rec.start()}catch(e){arret()}}};
  on=true;mic.classList.add('on');mic.textContent='⏹ Arrêter';$('vl').disabled=true;
  try{rec.start();stat('Je t\'écoute…')}catch(e){arret()}
 }
 mic.onclick=()=>on?arret():debut();
 $('d1').addEventListener('click',()=>{if(on)arret()});
 $('d2').addEventListener('click',()=>{if(on)arret()});$('clr').addEventListener('click',()=>{if(on)arret()});
})();
